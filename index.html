<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Arkadiy Doskin The Raider</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #182744;
      image-rendering: pixelated;
      touch-action: none;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    canvas.vertical-layout {
      width: min(100vw, calc(100vh * 0.5925926)) !important;
      height: min(100vh, calc(100vw * 1.6875)) !important;
    }

    canvas.horizontal-layout {
      width: min(100vw, calc(100vh * 1.7777778)) !important;
      height: min(100vh, calc(100vw * 0.5625)) !important;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="./game.js?v=1.2.7"></script>
</body>
</html>
